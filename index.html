canvas { display:block; }

#crosshair { position:absolute; left:50%; top:50%; width:0; height:0; }

.tnode { position:absolute; transform:translate(-50%,-50%); width:122px; height:118px;

.tnode.cant { cursor:default; }

.t3d { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .1s ease-out; }
.face { position:absolute; border-radius:14px; backface-visibility:hidden;
background:
radial-gradient(circle at 30% 22%, rgba(255,220,150,.10), transparent 55%),
repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 7px),
repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 5px),

box-shadow:0 6px 18px #000c; }
.face.front { inset:0; transform:translateZ(9px); }
.face.back { inset:0; transform:rotateY(180deg) translateZ(9px); background:linear-gradient(165deg,#141f0d,#0a1206); }
.face.left, .face.right { width:18px; left:50%; margin-left:-9px; top:0; height:100%; border-radius:6px;
background:linear-gradient(180deg,#1c2b12,#0a1406); border-color:rgba(212,175,55,.35); }
.face.left { transform:rotateY(-90deg) translateZ(61px); }
.face.right { transform:rotateY(90deg) translateZ(61px); }
.face.top, .face.bottom { height:18px; top:50%; margin-top:-9px; left:0; width:100%; border-radius:6px;

.face.top { transform:rotateX(90deg) translateZ(59px); }
.face.bottom { transform:rotateX(-90deg) translateZ(59px); }
.tnode.cant .face { opacity:.5; }
.tnode.max { animation:maxPulse 2.4s ease-in-out infinite; }

.tnode.max .tname { color:#dcb6f7; }
@keyframes maxPulse {
0% { transform:translate(-50%,-50%) scale(1); }
50% { transform:translate(-50%,-50%) scale(1.12); }
100% { transform:translate(-50%,-50%) scale(1); }
}
.tnode.max:hover { transform:translate(-50%,-50%) scale(1.12); }
.tnode .ico { display:flex; justify-content:center; color:#c9c0a6; margin-top:10px; }
.tnode .ico svg { width:26px; height:26px; }
.tname { font-family:'MedievalSharp',cursive; font-size:13px; color:#f0d68a; margin-top:2px; text-shadow:0 1px 0 #000; }
.tlvl { font-size:10px; color:#a9c48a; font-weight:800; letter-spacing:1px; margin-top:1px; min-height:12px; }

.tnode.max .tcost { background:#3a2a44; color:#c9a6ef; }
.tnode.max .tcost { background:#3a2a44; color:#c9a6ef; }
.udigit { height:1em; overflow:hidden; display:inline-block; vertical-align:bottom; }
.ureel { display:block; transition:transform .5s cubic-bezier(.25,.9,.3,1); }
.ureel span { display:block; height:1em; line-height:1em; }
.ulvl-roll, .ucost-roll { display:inline-block; }
.ulvl-static, .ucost-star, .ulvl-max, .ucost-max { display:inline-block; vertical-align:bottom; }
#ascendBtn { font-family:'MedievalSharp',cursive; font-size:15px; letter-spacing:1px; color:#cfe3b8;

#overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;

const head = (off, col) => {
x.fillStyle = col;
// ears
x.beginPath(); x.moveTo(86+off,98+off); x.lineTo(58+off,54+off); x.lineTo(108+off,76+off); x.closePath(); x.fill();
x.beginPath(); x.moveTo(170+off,98+off); x.lineTo(198+off,54+off); x.lineTo(148+off,76+off); x.closePath(); x.fill();
// head
x.beginPath(); x.arc(128+off, 126+off, 50, 0, 7); x.fill();
};
head(-2, pal[5]);
head(0, pal[4]);
// eyes
x.fillStyle = pal[0];
x.beginPath(); x.arc(110, 116, 9, 0, 7); x.fill();
x.beginPath(); x.arc(146, 116, 9, 0, 7); x.fill();
x.fillStyle = pal[3];
x.beginPath(); x.arc(112, 117, 4, 0, 7); x.fill();
x.beginPath(); x.arc(148, 117, 4, 0, 7); x.fill();
// nose
x.fillStyle = pal[3];
x.beginPath(); x.ellipse(128, 136, 9, 7, 0, 0, 7); x.fill();

x.strokeStyle = pal[3]; x.lineWidth = 5; x.lineCap = 'round';
x.beginPath(); x.arc(128, 140, 21, 0.2*Math.PI, 0.8*Math.PI); x.stroke();
// teeth
x.fillStyle = pal[0];
x.beginPath(); x.moveTo(114,155); x.lineTo(119,163); x.lineTo(124,156); x.closePath(); x.fill();
x.beginPath(); x.moveTo(132,156); x.lineTo(137,163); x.lineTo(142,155); x.closePath(); x.fill();

};

function updateVendor(dt, time){

const distP = Math.hypot(dx, dz);
const w = THREE.MathUtils.clamp((13 - distP)/6, 0, 1);
let headYaw = Math.sin(time*0.45)*0.4, headPitch = 0;
if (w > 0){
const rel = THREE.MathUtils.clamp(normAng(Math.atan2(dx,dz)), -1.1, 1.1);
headYaw = THREE.MathUtils.lerp(headYaw, rel, w);
headPitch = -Math.atan2(EYE - 1.0, Math.max(distP,0.6)) * 0.7 * w;
}
vendor.head.rotation.y = headYaw;
vendor.head.rotation.x = headPitch;
vendor.head.worldToLocal(_look.set(player.pos.x, player.pos.y - 0.2, player.pos.z)).normalize();
const ex = THREE.MathUtils.clamp(_look.x,-1,1)*0.02*w;
const ey = THREE.MathUtils.clamp(_look.y,-0.8,1)*0.018*w;
vendor.pupL.position.set(-0.088+ex, 0.06+ey, 0.215);
vendor.pupR.position.set( 0.088+ex, 0.06+ey, 0.215);
const waveTarget = distP < 5 ? 1 : 0;
vendor.waveAmt += (waveTarget - vendor.waveAmt)*Math.min(1,4*dt);
vendor.armR.rotation.x = -2.5*vendor.waveAmt;
vendor.armR.rotation.z = Math.sin(time*7)*0.4*vendor.waveAmt;
vendor.armL.rotation.x = Math.sin(time*1.6)*0.08;
let blinkScale = 1;
if (time >= vendor.nextBlink){
vendor.blinkT += dt;
const bp = vendor.blinkT/0.22;
if (bp >= 1){ vendor.blinkT = 0; vendor.nextBlink = time + 2.5 + Math.random()*4; }
else blinkScale = 1 - Math.sin(bp*Math.PI)*0.94;
}
vendor.eyeL.scale.y = vendor.eyeR.scale.y = blinkScale;
vendor.pupL.scale.y = vendor.pupR.scale.y = blinkScale;
vendor.shadow.position.set(p.x, 0.02, p.z);
// cat breathing
if (catBodyMesh) catBodyMesh.scale.y = 0.55 * (1 + Math.sin(time*1.6)*0.09);
}

function spawnCoin(pos, vel, silver=false){

/* manual ray-sphere picking (fast for 2000 coins) */
function pickCoin(){
raycaster.setFromCamera(SCREEN_C, camera);
const ro = raycaster.ray.origin, rd = raycaster.ray.direction;
let best = -1, bestT = 3.2;
for(let li=0; li<live.length; li++){
const i = live[li], s = ST[i];
if (s!==1 && s!==2) continue;
const i3 = i*3;
const dx=P[i3]-ro.x, dy=P[i3+1]-ro.y, dz=P[i3+2]-ro.z;
const t = dx*rd.x + dy*rd.y + dz*rd.z;
if (t < 0.15 || t > bestT) continue;
if (dx*dx+dy*dy+dz*dz - t*t < 0.0676){ best=i; bestT=t; }
}
return best;
}

coinDummy.updateMatrix();
coinMeshG.setMatrixAt(ng++, coinDummy.matrix);
}
}
coinMeshG.count=ng; coinMeshS.count=ns;
coinMeshG.instanceMatrix.needsUpdate = true;
coinMeshS.instanceMatrix.needsUpdate = true;
}

const keys = new Set();
function updatePlayer(dt){
const frozen = shopOpen || camMode !== 'play' || dlgOpen || cine;
let f = 0, r = 0;
if (!frozen){
f = (keys.has('KeyW')||keys.has('ArrowUp')?1:0) - (keys.has('KeyS')||keys.has('ArrowDown')?1:0);
r = (keys.has('KeyD')||keys.has('ArrowRight')?1:0) - (keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
}
const sy = Math.sin(yaw), cy = Math.cos(yaw);
let wx = (-sy)*f + cy*r, wz = (-cy)*f + (-sy)*r;
const wl = Math.hypot(wx,wz);
if (wl > 0){ wx/=wl; wz/=wl; }
const sprint = (keys.has('ShiftLeft')||keys.has('ShiftRight')) && f > 0 && !frozen;
const speed = sprint ? 7.2 : 4.6;
const accel = player.grounded ? 10 : 2.6;
player.vel.x += (wx*speed - player.vel.x)*Math.min(1, accel*dt);
player.vel.z += (wz*speed - player.vel.z)*Math.min(1, accel*dt);
player.pos.x += player.vel.x*dt;
player.pos.z += player.vel.z*dt;
const dH = Math.hypot(player.pos.x, player.pos.z);
if (dH > WORLD_R-2){
const s = (WORLD_R-2)/dH;
player.pos.x*=s; player.pos.z*=s;
}
player.vy -= GRAV*dt;
player.pos.y += player.vy*dt;
if (player.pos.y <= EYE && player.vy <= 0){
if (!player.grounded && player.vy < -3){ landDip = 0.13; thumpS(); }
player.grounded = true; player.vy = 0; player.pos.y = EYE;
} else player.grounded = false;
const spXZ = Math.hypot(player.vel.x, player.vel.z);
const prevBob = Math.floor(bobPhase/Math.PI);
bobPhase += spXZ*dt*2.2;
if (player.grounded && Math.floor(bobPhase/Math.PI) !== prevBob && spXZ > 1.2) stepS();
grassMat.uniforms.uPlayer.value.set(player.pos.x, 0, player.pos.z);
if (camMode === 'play'){
const bob = player.grounded ? Math.sin(bobPhase*2)*0.03*Math.min(1,spXZ/4.6) : 0;
landDip *= Math.exp(-8*dt);
const turn = (yaw - prevYaw)/Math.max(dt,0.001); prevYaw = yaw;
turnSm += (turn - turnSm)*Math.min(1,12*dt);
const rollTarget = THREE.MathUtils.clamp(-turnSm*0.085, -0.055, 0.055) + r*0.024*Math.min(1,spXZ/4);
roll += (rollTarget - roll)*Math.min(1,9*dt);
const fovT = 74 + (sprint && spXZ>2 ? 8 : 0) + (!player.grounded ? 2 : 0);
fov += (fovT - fov)*Math.min(1,6*dt);
if (Math.abs(camera.fov - fov) > 0.02){ camera.fov = fov; camera.updateProjectionMatrix(); }
// Idle camera sway when not moving
idleSwayTime += dt;
const idleAmp = Math.min(1, 8/spXZ) * 0.012;
const swayYaw = Math.sin(idleSwayTime * 0.7) * idleAmp;
const swayPitch = Math.cos(idleSwayTime * 0.5) * idleAmp * 0.7;
camera.rotation.set(pitch + swayPitch, yaw + swayYaw, roll);
camera.position.set(player.pos.x, player.pos.y + bob - landDip, player.pos.z);
} else {
prevYaw = yaw;
}
}

function updateRain(dt, time){

rainFactor = f*f*(3-2*f);

startIntroCine();
} else {
try { renderer.domElement.requestPointerLock(); } catch(e){}
}
});
document.addEventListener('pointerlockchange', ()=>{
locked = document.pointerLockElement === renderer.domElement;
if (locked){
document.body.classList.add('locked');
overlay.classList.add('hidden');
if (!started){
started = true;
player.pos.set(0,EYE,6.8); yaw = 0; pitch = -0.08;
}
} else {
document.body.classList.remove('locked');
mouseHeld = false; rightMouseHeld = false; releaseMagnet();
if (started && !shopOpen && !cine) showPause();
}
});
addEventListener('resize', ()=>{
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth, innerHeight);
});

/* ============================== 3D MAIN MENU ============================== */
const menuGroup = new THREE.Group();
scene.add(menuGroup);
let menuReady = false, menuFading = false, menuFade = 1, menuHover = false;
let menuHolding = false, menuHold = 0;
let menuTitle = null, menuBtn = null, menuBar = null;
let menuBtnHit = [], menuBtnMat = null;
const MENU_HOLD_TIME = 1.1;
const menuMats = [];
const menuNdc = new THREE.Vector2(0, 0);
const menuRay = new THREE.Raycaster();
function menuMat(m){ m.transparent = true; menuMats.push(m); return m; }

function buildMenu(font){
  // ---- "GRIMBLE" as extruded 3D letters, no UI container ----
  const titleGeo = new TextGeometry('GRIMBLE', {
    font, size: 1.35, height: 0.42, curveSegments: 8,
    bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.045, bevelSegments: 3
  });
  titleGeo.center();
  const titleFace = menuMat(new THREE.MeshToonMaterial({ color: 0xf5cf5f, gradientMap: gradTex }));
  const titleSide = menuMat(new THREE.MeshToonMaterial({ color: 0x8a5c14, gradientMap: gradTex }));
  menuTitle = new THREE.Mesh(titleGeo, [titleFace, titleSide]);
  menuTitle.position.set(0, 3.35, 0);
  menuGroup.add(menuTitle);

  // ---- 3D start button (HOLD to enter) ----
  menuBtn = new THREE.Group();
  menuBtnMat = menuMat(new THREE.MeshToonMaterial({ color: 0x33421f, gradientMap: gradTex }));
  const btnBody = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.0, 0.3), menuBtnMat);
  menuBtn.add(btnBody);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(4.62, 1.22, 0.22),
    menuMat(new THREE.MeshToonMaterial({ color: 0x7a5a1e, gradientMap: gradTex })));
  rim.position.z = -0.07;
  menuBtn.add(rim);
  const labGeo = new TextGeometry('ENTER THE MEADOW', { font, size: 0.32, height: 0.1 });
  labGeo.center();
  const label = new THREE.Mesh(labGeo, menuMat(new THREE.MeshToonMaterial({ color: 0xf2d894, gradientMap: gradTex })));
  label.position.z = 0.21;
  menuBtn.add(label);
  // hold-progress bar (fills left -> right)
  const barBack = new THREE.Mesh(new THREE.PlaneGeometry(3.9, 0.14),
    menuMat(new THREE.MeshBasicMaterial({ color: 0x140d05 })));
  barBack.position.set(0, -0.32, 0.16);
  menuBtn.add(barBack);
  const barGeo = new THREE.PlaneGeometry(3.9, 0.14);
  barGeo.translate(3.9 / 2, 0, 0); // origin at left edge so scale.x fills it
  menuBar = new THREE.Mesh(barGeo, menuMat(new THREE.MeshBasicMaterial({ color: 0xf5cf5f })));
  menuBar.position.set(-3.9 / 2, -0.32, 0.17);
  menuBar.scale.x = 0.001;
  menuBtn.add(menuBar);
  menuBtn.position.set(0, 1.5, 0);
  menuGroup.add(menuBtn);
  menuBtnHit = [btnBody, rim, label];
}

new FontLoader().load(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/fonts/gentilis_bold.typeface.json',
  (font) => {
    buildMenu(font);
    menuReady = true;
    overlay.classList.add('hidden');
    document.body.classList.add('menu');
  },
  undefined,
  () => { overlay.classList.remove('hidden'); /* font failed: show old HTML overlay as fallback */ }
);

function ensureFirstGoblin(){
if (!goblins.length){
const g = makeGoblin(1.8, 7.6);
g.root.visible = false;   // stay hidden until the falling cutscene
g.shadow.visible = false;
}
}

function startFromMenu(){
  if (!menuReady || menuFading) return;
  menuFading = true;
  menuHolding = false;
  for (const m of menuMats) m.depthWrite = false;
  document.body.classList.remove('menu');
  renderer.domElement.style.cursor = '';
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  ensureFirstGoblin();
  if (!introDone){ introDone = true; startIntroCine(); }
  else { try { renderer.domElement.requestPointerLock(); } catch(e){} }
}

addEventListener('mousemove', (e) => {
  if (!menuReady || menuFading || locked) return;
  menuNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
addEventListener('mousedown', (e) => {
  if (e.button === 0 && menuReady && !menuFading && !locked && menuHover) menuHolding = true;
});
addEventListener('mouseup', (e) => {
  if (e.button === 0) menuHolding = false;
});

function updateMenu(dt, time){
  if (menuFading){
    menuFade = Math.max(0, menuFade - dt / 0.8);
    for (const m of menuMats) m.opacity = menuFade;
    if (menuFade <= 0){
      scene.remove(menuGroup);
      menuReady = false;
      return;
    }
  } else if (menuHolding && menuHover){
    menuHold = Math.min(1, menuHold + dt / MENU_HOLD_TIME);
    if (menuHold >= 1) startFromMenu();
  } else if (menuHold > 0){
    menuHold = Math.max(0, menuHold - dt * 2.5); // drains when released
  }
  // gentle float
  if (menuTitle) menuTitle.position.y = 3.35 + Math.sin(time * 0.9) * 0.09;
  if (menuBtn)   menuBtn.position.y   = 1.5  + Math.sin(time * 0.9 + 1.7) * 0.06;
  // billboard (yaw only, stays upright)
  for (const o of [menuTitle, menuBtn]){
    if (!o) continue;
    o.rotation.y = Math.atan2(camera.position.x - o.position.x, camera.position.z - o.position.z);
  }
  // hover picking on the 3D button
  if (!locked && !menuFading && menuBtn){
    menuRay.setFromCamera(menuNdc, camera);
    const hit = menuRay.intersectObjects(menuBtnHit, false).length > 0;
    if (hit !== menuHover){
      menuHover = hit;
      renderer.domElement.style.cursor = hit ? 'pointer' : '';
    }
    if (!menuHover) menuHolding = false;
  }
  // hold animation: press-in + shimmer + glow, spring back on release
  const targetS = menuHolding ? 0.94 + Math.sin(time * 26) * 0.01 : (menuHover ? 1.07 : 1);
  menuBtn.scale.lerp(_v1.set(targetS, targetS, targetS), Math.min(1, 12 * dt));
  if (menuBtnMat) menuBtnMat.emissive.setHex(menuHolding ? 0x2c3d12 : (menuHover ? 0x1c2a10 : 0x000000));
  if (menuBar) menuBar.scale.x = Math.max(0.001, menuHold);
}
/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();
let elapsed = 0;
let rainUpdateAccum = 0;
function animate(){
requestAnimationFrame(animate);
const dt = Math.min(clock.getDelta(), 0.05);
const paused = shopPhase === 'hole' || (cine && cine.type === 'sac');
if (!paused) elapsed += dt;
if (!paused){
if (keys.has('KeyQ') && keys.has('KeyP') && !dlgOpen) cheatT += dt; else if (!keys.has('KeyQ') || !keys.has('KeyP')) cheatT = 0;
if (!cheat && cheatT >= 5){
cheat = true;
setCoinDisplay(0);
toast('The meadow provides…');
tone(392,0.3,'sine',0.2); tone(523,0.3,'sine',0.2,0.12); tone(659,0.5,'sine',0.2,0.24);
if (shopOpen) refreshTree();
}
}
if (AC){
const inHole = shopPhase === 'hole';
windBus.gain.value  += ((inHole ? 0 : 1)   - windBus.gain.value)  * Math.min(1, 3*dt);
/* skill-tree ambience at half volume */
eerieBus.gain.value += ((inHole ? 0.45 : 0) - eerieBus.gain.value) * Math.min(1, 2*dt);
if (inHole && elapsed > eerieNext){ eerieTone(); eerieNext = elapsed + 4 + Math.random()*7; }
}
if (!paused){
updateRain(dt, elapsed);
for (const g of goblins) updateGoblin(g, dt, elapsed);
let ng = goblins[0], bd = Infinity;
for (const g of goblins){
if (g.state === 'held') continue;
const d = (g.root.position.x-player.pos.x)**2 + (g.root.position.z-player.pos.z)**2;
if (d < bd){ bd = d; ng = g; }
}
if (ng) grassMat.uniforms.uGoblin.value.set(ng.root.position.x, 0, ng.root.position.z);
updateVendor(dt, elapsed);
updateWitch(dt, elapsed);
updateCoins(dt, elapsed);
updateButterflies(dt, elapsed);
goldBurst.update(dt);
violetBurst.update(dt);
dirtBurst.update(dt);
updateFloatTexts(dt);
updateTreeSway(elapsed);
if (lampLight) {
  lampLight.intensity = (14 + Math.sin(elapsed*11)*1.2 + Math.sin(elapsed*23+1.7)*0.8) * (1 + 0.5*rainFactor);
}
// Update lantern moths orbit with sine wobble
for(const moth of mothGeos){
const u = moth.userData;
u.angle += u.speed * dt;
const wobble = Math.sin(elapsed * 2 + u.phase) * 0.06;
moth.position.set(Math.cos(u.angle) * (u.radius + wobble), Math.sin(u.angle * 2 + u.phase) * 0.04, Math.sin(u.angle) * (u.radius + wobble));
moth.rotation.z = elapsed * 3 + u.phase;
}
// Update hole dust prestige uniform
holeDustMat.uniforms.uPrestige.value = THREE.MathUtils.lerp(holeDustMat.uniforms.uPrestige.value, Math.min(prestige, 1), Math.min(1, 2*dt));
for (const c of clouds){
c.position.x += c.userData.spd*dt;
if (c.position.x > 260) c.position.x = -260;
}
for(let i=0;i<POLLEN_N;i++){
const b = pollenBase[i];
pollenPos[i*3]   = b.x + Math.sin(elapsed*0.15 + b.p)*2 + Math.sin(elapsed*0.4+b.p*2)*0.3;
pollenPos[i*3+1] = b.y + Math.sin(elapsed*0.3 + b.p)*0.5;
pollenPos[i*3+2] = b.z + Math.cos(elapsed*0.12 + b.p)*2;
}
pollenGeo.attributes.position.needsUpdate = true;
if (started && !witchSpawned && !cine && !dlgOpen && camMode === 'play' && allMaxed()){
startWitchCine();
document.body.classList.add('cineMode');
}
if (started && witchSpawned && !reMaxToastDone && prestige > 0 && allMaxed() && camMode === 'play' && !cine){
reMaxToastDone = true;
toast('The witch awaits at the far end…');
}
}
grassMat.uniforms.uTime.value = elapsed;
holeDustMat.uniforms.uTime.value = elapsed;
updateListener();
updateTreeDust(dt);
rainUpdateAccum += dt;
if (rainUpdateAccum >= 0.5) {
rainUpdateAccum = 0;
updateRainDisplay();
}
sun.position.copy(player.pos).addScaledVector(sunDir, 30);
if (!started && !cine){
// main menu orbit (pulls in while holding the button)
const t = elapsed*0.12;
const rad = 11 - menuHold*2.2;
camera.position.set(Math.sin(t)*rad, 4.3+Math.sin(elapsed*0.3)*0.4 - menuHold*0.5, Math.cos(t)*rad);
camera.lookAt(0, 0.3 + menuHold*0.6, 0);
} else {
if (locked && !cine) updatePlayer(dt);
if (cine) updateCine(dt, elapsed);
else if (camMode !== 'play') updateCameraAnim(dt);
if (locked && camMode === 'play' && !shopOpen && !cine && !dlgOpen) updatePrompt();
if (heldGoblin && locked && camMode === 'play') updateHeldGoblin();
if (locked && camMode === 'play' && !cine){
const spXZ = Math.hypot(player.vel.x, player.vel.z);
const target = 1 + Math.min(1, spXZ/7.2)*0.5 + (magnetActiveNow ? 0.15 : 0);
chScale += (target - chScale)*Math.min(1, 10*dt);
chWrap.style.transform = `scale(${chScale.toFixed(3)})`;
crosshair.classList.toggle('magnet', magnetActiveNow);
}
if (shopOpen && shopPhase !== 'hole'){
const n = live.length;
if (wcNum.textContent != n) wcNum.textContent = n;
}
}
if (shake > 0.001 && camMode !== 'hole' && camMode !== 'toHole' && camMode !== 'outHole'){
shake *= Math.exp(-5*dt);
camera.position.x += (Math.random()-0.5)*0.14*shake;
camera.position.y += (Math.random()-0.5)*0.10*shake;
camera.position.z += (Math.random()-0.5)*0.14*shake;
}
if (menuReady) updateMenu(dt, elapsed);
updateFlare();
renderer.render(scene, camera);
}
updateRainDisplay();
animate();
</script>
</body>
</html>
